<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="image.png" alt=" Mountain image">
   <table>
    <caption>Employee details</caption>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Fav Language</th>
    </tr>
    <tr>
        <td>Prince sharma</td>
        <td>19</td>
        <td>Java</td>
    </tr>
    <tr>
        <td>sam</td>
        <td>28</td>
        <td>rust</td>
    </tr>
    <tr>
        <td>emily</td>
        <td>34</td>
        <td>Mysql</td>
    </tr>
   </table>
   <h1>Unordered list</h1>
   <ul type="square">
    <li>Prince sharma</li>
    <li>henry</li>
    <li>mark</li>
    <li>lacy</li>
   </ul>
   <h1>Ordered list</h1>
   <ol>
    <li>Prince sharma</li>
    <li>henry</li>
    <li>mark</li>
    <li>lacy</li>
   </ol>
</body>
</html>
