<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - Lets learn it</title>
</head>

<body>
    <h1>Sumit you details for register</h1>
    <form action="post"></form>
    <label for="username">Enter your username</label>
    <input type="text" name="username" placeholder="Enter you username">
    <div>
        <input type="radio" id="Male" name="Gender" value="Male">
        <label for="Male">Male</label>
        <input type="radio" id="Female" name="Gender" value="Female">
        <label for="Female">Female</label>
    </div>
    <div>
        <input type="checkbox" id="Subscribe" name="Subscribe" value="yes">
        <label for="Subscribe">Subs to prince</label>
    </div>
    <div>
        <label for="Comment">Enter your Comment</label>
        <br>
        <textarea name="Comment" id="Comment" rows="4" cols="40"></textarea>
    </div>
    <div>
        <select name="Branch">
            <option value="Comp science">Comp science</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Electronics">Electronics</option>
            <option value="Electrical">Electrical</option>
        </select>
    </div>
</body>

</html>
