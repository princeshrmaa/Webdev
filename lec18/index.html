<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS boxmodel</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            background-color: yellow;
        }
        .box1{
            color: red;
            padding: 10px;
            margin: 25px;
            height: 200px;
            box-sizing: border-box;
        }
        .box2{
            color: blue;
            padding: 10px;
            margin: 25px;
            height: 200px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="box box1">i am box</div>
    <div class="box box2">i am box2</div>
</body>

</html>
